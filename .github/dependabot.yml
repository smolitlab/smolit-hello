# Dependabot hebt gepinnte SHAs und Versionskommentare gemeinsam.
# Minor und Patch kommen gesammelt in einem PR, Major-Sprünge einzeln.
# Cooldown: neue Releases erst nach 7 Tagen übernehmen.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
